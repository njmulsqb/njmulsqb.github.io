<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ site.description | default: site.title }}" />
    {% seo %}
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ '/assets/css/mono.css' | relative_url }}" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="brand">
          <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        </div>
        <nav class="site-nav" aria-label="Main navigation">
          {% include navigation.html %}
        </nav>
      </header>

      <main class="site-main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <p><a href="{{ '/digital-presence/' | relative_url }}">Digital presence</a></p>
        <p>© {{ 'now' | date: '%Y' }} {{ site.title }}</p>
      </footer>
    </div>
  </body>
</html>
